<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fairshift for Outlook Calendar</title>
  <meta name="description" content="Concept prototype: time-zone-fair recurring meetings for Outlook Calendar's Scheduling Assistant.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6cbd'/%3E%3Cpath d='M9 22a7 7 0 0 1 14 0' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='11' r='2.6' fill='%23ffd166'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="concept-banner" role="note">
    <strong>Concept prototype</strong> — an unofficial "Hack to the Future" entry showing a feature Outlook Calendar could ship. Not affiliated with or endorsed by Microsoft. All people are fictional.
  </div>

  <header class="appbar">
    <button class="icon-btn waffle" aria-label="App launcher">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><g fill="currentColor"><circle cx="4" cy="4" r="1.6"/><circle cx="10" cy="4" r="1.6"/><circle cx="16" cy="4" r="1.6"/><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="16" cy="10" r="1.6"/><circle cx="4" cy="16" r="1.6"/><circle cx="10" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.6"/></g></svg>
    </button>
    <span class="appname">Calendar</span>
    <div class="search"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8.5 3a5.5 5.5 0 0 1 4.38 8.83l4.15 4.14-.71.71-4.14-4.15A5.5 5.5 0 1 1 8.5 3Zm0 1a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/></svg><span>Search</span></div>
    <div class="appbar-right">
      <span class="avatar small" style="--c:#0f6cbd" title="Maya Chen (you)">MC</span>
    </div>
  </header>

  <div class="ribbon">
    <div class="ribbon-left">
      <button class="btn primary" id="sendBtn">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M2.72 2.05 17.5 9.4a.68.68 0 0 1 0 1.2L2.72 17.95a.5.5 0 0 1-.7-.58L3.9 10 2.02 2.63a.5.5 0 0 1 .7-.58ZM4.75 10.5l-1.55 6.06L16.17 10 3.2 3.44 4.75 9.5H11a.5.5 0 0 1 0 1H4.75Z"/></svg>
        Send
      </button>
      <button class="btn ghost">Discard</button>
      <span class="divider"></span>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="false" disabled>Event</button>
        <button class="tab active" role="tab" aria-selected="true">Scheduling Assistant</button>
      </div>
      <span class="divider"></span>
      <span class="ribbon-meta">Busy</span>
      <span class="ribbon-meta">
        <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M14.85 2.15a.5.5 0 0 0-.7.7L15.29 4H7a5 5 0 0 0-5 5v.5a.5.5 0 0 0 1 0V9a4 4 0 0 1 4-4h8.3l-1.15 1.15a.5.5 0 0 0 .7.7l2-2a.5.5 0 0 0 0-.7l-2-2Zm-9.7 15.7a.5.5 0 1 0 .7-.7L4.71 16H13a5 5 0 0 0 5-5v-.5a.5.5 0 0 0-1 0v.5a4 4 0 0 1-4 4H4.7l1.15-1.15a.5.5 0 0 0-.7-.7l-2 2a.5.5 0 0 0 0 .7l2 2Z"/></svg>
        Repeat: Weekly
      </span>
    </div>
    <div class="ribbon-right">
      <div class="seg" role="radiogroup" aria-label="Compare">
        <button class="seg-btn" data-mode="classic" role="radio">Today's Outlook</button>
        <button class="seg-btn" data-mode="fairshift" role="radio">With Fairshift <span class="spark">✦</span></button>
      </div>
      <button class="btn ghost" id="tourBtn" title="Guided demo">▶ Guided demo</button>
    </div>
  </div>

  <main class="layout" id="layout">
    <aside class="details panel" id="details"></aside>
    <section class="assistant panel" id="assistant"></section>
    <aside class="insights panel" id="insights"></aside>
  </main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Invitation preview</h2>
        <button class="icon-btn" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot">
        <span class="muted">Prototype only — nothing is sent.</span>
        <button class="btn primary" id="modalOk">Done</button>
      </div>
    </div>
  </div>

  <div class="tour" id="tour" hidden>
    <div class="tour-card" id="tourCard">
      <div class="tour-step" id="tourStep"></div>
      <div class="tour-text" id="tourText"></div>
      <div class="tour-actions">
        <button class="btn ghost" id="tourSkip">Exit</button>
        <button class="btn primary" id="tourNext">Next</button>
      </div>
    </div>
  </div>

  <script src="js/fairshift.js"></script>
  <script src="js/people.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
